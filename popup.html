<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 420px; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; }
    h2 { text-align: center; color: #818cf8; margin-top: 0; margin-bottom: 5px; font-size: 20px;}
    p.subtitle { text-align: center; font-size: 12px; color: #94a3b8; margin-bottom: 20px; }
    input, select, button { width: 100%; box-sizing: border-box; margin-bottom: 12px; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }
    input:focus, select:focus { border-color: #6366f1; }
    button { background: linear-gradient(to right, #4f46e5, #7c3aed); font-weight: bold; cursor: pointer; border: none; font-size: 14px; transition: 0.2s; }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hidden { display: none; }
    h3 { color: #38bdf8; margin-top: 15px; margin-bottom: 8px; font-size: 14px;}
    div.text { font-size: 13px; background: #1e293b; padding: 12px; border-radius: 8px; border: 1px solid #334155; white-space: pre-wrap; line-height: 1.5; color: #cbd5e1; }
    .loader { text-align: center; color: #60a5fa; font-weight: bold; margin: 20px 0; font-size: 13px; }
  </style>
</head>
<body>
  <h2>AI Video Cloner</h2>
  <p class="subtitle">Открой видео на YouTube и нажми кнопку</p>
  
  <select id="aiProvider">
    <option value="deepseek">DeepSeek V3 / R1</option>
    <option value="gemini">Google Gemini 1.5</option>
    <option value="qwen">Qwen Max</option>
  </select>
  
  <input type="password" id="apiKey" placeholder="Вставьте API-ключ выбранной нейросети">
  
  <button id="submitBtn">🚀 Сгенерировать контент</button>
  
  <div id="loader" class="hidden loader">⏳ Парсим страницу и генерируем сценарий...</div>
  
  <div id="resultContainer" class="hidden">
    <h3>🔥 Идеи заголовка & Хук</h3>
    <div class="text" id="resTitleHook"></div>
    
    <h3>📜 Сценарий (Быстрый монтаж)</h3>
    <div class="text" id="resScript"></div>
    
    <h3>📌 SEO Описание & Теги</h3>
    <div class="text" id="resSEO"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
