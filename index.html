<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Script Cloner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-5xl mx-auto space-y-8">
    
    <header class="text-center space-y-3">
      <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
        AI Video Cloner
      </h1>
      <p class="text-gray-400">Сгенерируйте сценарий и SEO из любого YouTube видео</p>
    </header>

    <!-- Блок настроек API -->
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-lg">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-gray-200">🔑 API Ключи (Сохраняются локально)</h2>
        <button onclick="saveKeys()" class="bg-gray-700 hover:bg-gray-600 text-sm px-4 py-2 rounded-lg transition-colors">
          Сохранить ключи
        </button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">DeepSeek API Key</label>
          <input type="password" id="keyDeepseek" placeholder="sk-..." class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Qwen API Key</label>
          <input type="password" id="keyQwen" placeholder="sk-..." class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Gemini API Key</label>
          <input type="password" id="keyGemini" placeholder="AIzaSy..." class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-[10px] text-blue-400 hover:underline mt-1 inline-block">Получить бесплатно</a>
        </div>
      </div>
    </div>

    <!-- Основная форма -->
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-lg space-y-5">
      <div>
        <label class="block text-sm font-semibold text-gray-300 mb-2">Ссылка на YouTube видео (или Shorts)</label>
        <input type="url" id="videoUrl" placeholder="https://youtube.com/watch?v=..." class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 text-white focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div class="flex flex-col md:flex-row gap-4">
        <div class="w-full md:w-1/3">
          <label class="block text-sm font-semibold text-gray-300 mb-2">Нейросеть</label>
          <select id="aiProvider" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 text-white focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
            <option value="gemini">Google Gemini 1.5 (Быстро)</option>
            <option value="deepseek">DeepSeek V3</option>
            <option value="qwen">Qwen Max</option>
          </select>
        </div>
        <div class="w-full md:w-2/3 flex items-end">
          <button onclick="generateScript()" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg transform active:scale-[0.98]">
            🚀 Сгенерировать контент
          </button>
        </div>
      </div>
    </div>

    <!-- Индикатор загрузки -->
    <div id="loader" class="hidden flex flex-col items-center py-10 space-y-3">
      <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
      <p id="loaderText" class="text-blue-400 font-medium text-sm">Парсинг видео...</p>
    </div>

    <!-- Результат -->
    <div id="resultContainer" class="hidden space-y-6">
      <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-lg">
        <h3 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-red-500 mb-2">🔥 Идеи заголовка & Хук</h3>
        <p id="resTitle" class="font-bold text-gray-200 mb-2"></p>
        <p id="resHook" class="text-lg italic text-gray-400 border-l-4 border-orange-500 pl-4"></p>
      </div>

      <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-lg">
        <h3 class="text-xl font-black text-blue-400 mb-4">📜 Сценарий</h3>
        <div id="resScript" class="whitespace-pre-wrap text-gray-300 leading-relaxed font-medium"></div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-lg">
          <h3 class="font-bold text-green-400 mb-3">📌 Описание & SEO</h3>
          <p id="resSEO" class="text-sm text-gray-300 mb-4 whitespace-pre-wrap"></p>
          <div class="bg-gray-900 p-3 rounded-lg">
            <p id="resTags" class="text-xs text-blue-300 font-mono break-words"></p>
          </div>
        </div>
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-lg">
          <h3 class="font-bold text-purple-400 mb-3">🎬 Видеоряд (B-Roll)</h3>
          <p id="resVisuals" class="text-sm text-gray-300 whitespace-pre-wrap"></p>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ВАЖНО: Вставьте сюда URL вашего развернутого Google Apps Script
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyXKg8sGpXgRJ75rq1x_Ff0WdskUPs_XkfP1swqqXBJkmYmOEQf0mKODu987TP-6Fv-/exec";

    // Инициализация при загрузке
    window.onload = () => {
      ['keyDeepseek', 'keyQwen', 'keyGemini'].forEach(id => {
        if (localStorage.getItem(id)) document.getElementById(id).value = localStorage.getItem(id);
      });
    };

    function saveKeys() {
      ['keyDeepseek', 'keyQwen', 'keyGemini'].forEach(id => {
        localStorage.setItem(id, document.getElementById(id).value.trim());
      });
      alert("✅ Ключи сохранены в браузере");
    }

    async function generateScript() {
      const url = document.getElementById('videoUrl').value.trim();
      const provider = document.getElementById('aiProvider').value;
      const loader = document.getElementById('loader');
      const loaderText = document.getElementById('loaderText');
      const resultContainer = document.getElementById('resultContainer');
      const btn = document.getElementById('submitBtn');

      const keys = {
        deepseek: document.getElementById('keyDeepseek').value.trim(),
        qwen: document.getElementById('keyQwen').value.trim(),
        gemini: document.getElementById('keyGemini').value.trim()
      };

      if (!keys[provider]) {
        alert(`❌ Укажите API-ключ для ${provider.toUpperCase()}`);
        return;
      }
      if (!url) {
        alert("❌ Вставьте ссылку на видео");
        return;
      }
      if (GAS_WEB_APP_URL === "ВАШ_URL_ИЗ_GOOGLE_APPS_SCRIPT") {
        alert("❌ Вы не указали GAS_WEB_APP_URL в коде страницы!");
        return;
      }

      // UI States
      btn.disabled = true;
      btn.classList.add('opacity-50');
      resultContainer.classList.add('hidden');
      loader.classList.remove('hidden');

      try {
// 1. Получаем транскрипт через бэкенд
        loaderText.innerText = "1/2: Извлекаем субтитры из видео...";
        const gasRes = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8' // ИМЕННО text/plain спасает от CORS
          },
          body: JSON.stringify({ url: url })
        });
        const gasData = await gasRes.json();

        // 2. Отправляем в нейросеть
        loaderText.innerText = `2/2: Генерируем сценарий через ${provider.toUpperCase()}...`;
        const aiData = await callAI(provider, keys[provider], transcript);

        // 3. Рендер результатов
        document.getElementById('resTitle').innerText = Array.isArray(aiData.title) ? aiData.title.join(' | ') : aiData.title;
        document.getElementById('resHook').innerText = aiData.hook;
        document.getElementById('resScript').innerText = aiData.script;
        document.getElementById('resSEO').innerText = aiData.seo_description;
        document.getElementById('resTags').innerText = aiData.hashtags;
        document.getElementById('resVisuals').innerText = aiData.visuals;
        
        resultContainer.classList.remove('hidden');

      } catch (err) {
        alert("⚠️ Произошла ошибка:\n" + err.message);
      } finally {
        loader.classList.add('hidden');
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      }
    }

    async function callAI(provider, key, text) {
      const prompt = `Ты эксперт по контенту на YouTube. Перепиши этот сценарий своими словами, сохранив структуру, но сделай его лучше и виральнее.
Формат ответа СТРОГО в JSON (без лишнего текста и без маркдауна):
{
  "title": "3 варианта кликабельного заголовка",
  "hook": "Мощный хук для первых 3 секунд",
  "script": "Полный текст нового сценария, разделенный на абзацы",
  "visuals": "Идеи для монтажа/B-roll",
  "seo_description": "SEO описание",
  "hashtags": "#тег1 #тег2"
}`;

      let endpoint, headers, body;

      if (provider === 'gemini') {
        endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
        headers = { "Content-Type": "application/json" };
        body = {
          contents: [{ role: "user", parts: [{ text: prompt + "\n\nИсходник:\n" + text }] }],
          generationConfig: { responseMimeType: "application/json" }
        };
      } else {
        endpoint = provider === 'qwen' 
          ? "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions" 
          : "https://api.deepseek.com/chat/completions";
        
        headers = { "Content-Type": "application/json", "Authorization": `Bearer ${key}` };
        body = {
          model: provider === 'qwen' ? "qwen-plus" : "deepseek-chat",
          messages: [
            { role: "system", content: prompt },
            { role: "user", content: "Исходник:\n" + text }
          ],
          response_format: { type: "json_object" }
        };
      }

      const res = await fetch(endpoint, { method: "POST", headers, body: JSON.stringify(body) });
      const rawData = await res.json();

      if (!res.ok) throw new Error(rawData.error?.message || "Ошибка API ИИ");

      let contentStr = provider === 'gemini' 
        ? rawData.candidates[0].content.parts[0].text 
        : rawData.choices[0].message.content;

      // Очистка от возможных Markdown тегов (например ```json ... ```)
      contentStr = contentStr.replace(/```json/gi, '').replace(/```/gi, '').trim();
      
      return JSON.parse(contentStr);
    }
  </script>
</body>
</html>
