<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Script Cloner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-5xl mx-auto space-y-8">
    
    <header class="text-center space-y-3">
      <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">
        AI Video Cloner
      </h1>
      <p class="text-slate-400">Клонируй структуру чужих видео и получай готовый виральный сценарий</p>
    </header>

    <!-- Настройки API -->
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-slate-200">🔑 API Ключи (Сохраняются в браузере)</h2>
        <button onclick="saveKeys()" class="bg-slate-700 hover:bg-slate-600 text-sm px-4 py-2 rounded-lg transition-colors">
          💾 Сохранить
        </button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">DeepSeek API Key</label>
          <input type="password" id="keyDeepseek" placeholder="sk-..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Qwen API Key</label>
          <input type="password" id="keyQwen" placeholder="sk-..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Gemini API Key</label>
          <input type="password" id="keyGemini" placeholder="AIzaSy..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>
    </div>

    <!-- Основная форма -->
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-5">
      <div>
        <label class="block text-sm font-semibold text-slate-300 mb-2">Ссылка на видео или Shorts</label>
        <input type="url" id="videoUrl" placeholder="https://www.youtube.com/shorts/..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <div class="flex flex-col md:flex-row gap-4">
        <div class="w-full md:w-1/3">
          <label class="block text-sm font-semibold text-slate-300 mb-2">Нейросеть</label>
          <select id="aiProvider" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer">
            <option value="deepseek">DeepSeek V3</option>
            <option value="gemini">Google Gemini 1.5</option>
            <option value="qwen">Qwen Max</option>
          </select>
        </div>
        <div class="w-full md:w-2/3 flex items-end">
          <button onclick="generateScript()" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg transform active:scale-[0.98]">
            🚀 Сгенерировать контент
          </button>
        </div>
      </div>
    </div>

    <!-- Загрузка -->
    <div id="loader" class="hidden flex flex-col items-center py-10 space-y-3">
      <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
      <p id="loaderText" class="text-indigo-400 font-medium text-sm">Связываемся с бэкендом...</p>
    </div>

    <!-- Результат -->
    <div id="resultContainer" class="hidden space-y-6">
      <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
        <h3 class="text-xl font-black text-amber-400 mb-2">🔥 Идеи заголовка & Хук</h3>
        <p id="resTitle" class="font-bold text-slate-200 mb-2"></p>
        <p id="resHook" class="text-lg italic text-slate-400 border-l-4 border-amber-500 pl-4"></p>
      </div>

      <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
        <h3 class="text-xl font-black text-indigo-400 mb-4">📜 Сценарий</h3>
        <div id="resScript" class="whitespace-pre-wrap text-slate-300 leading-relaxed font-medium"></div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
          <h3 class="font-bold text-emerald-400 mb-3">📌 Описание & Теги</h3>
          <p id="resSEO" class="text-sm text-slate-300 mb-4 whitespace-pre-wrap"></p>
          <div class="bg-slate-900 p-3 rounded-lg">
            <p id="resTags" class="text-xs text-indigo-300 font-mono break-words"></p>
          </div>
        </div>
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
          <h3 class="font-bold text-purple-400 mb-3">🎬 B-Roll (Монтаж)</h3>
          <p id="resVisuals" class="text-sm text-slate-300 whitespace-pre-wrap"></p>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ВСТАВЬ СЮДА НОВУЮ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT !!!
    // Обращение к открытому независимому API напрямую из браузера
    async function fetchSubtitles(url) {
      // 1. Вытаскиваем ID видео
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|\/shorts\/)([^#\&\?]*).*/;
      const match = url.match(regExp);
      const videoId = (match && match[2].length === 11) ? match[2] : null;
      
      if (!videoId) throw new Error("Неверная ссылка на видео");

      // 2. Стучимся в открытый API (без блокировок CORS)
      // Сначала запрашиваем русские субтитры
      let res = await fetch(`https://youtube-transcript.ai/transcript/${videoId}.txt?lang=ru`);
      
      // Если русских нет, берем оригинальные
      if (!res.ok) {
        res = await fetch(`https://youtube-transcript.ai/transcript/${videoId}.txt`);
      }

      if (!res.ok) {
        throw new Error("❌ API не смог вытащить субтитры. Скорее всего, автор их полностью запретил.");
      }

      // API отдает готовый текстовый документ с таймкодами, ИИ его отлично поймет
      return await res.text();
    }

    window.onload = () => {
      ['keyDeepseek', 'keyQwen', 'keyGemini'].forEach(id => {
        if (localStorage.getItem(id)) document.getElementById(id).value = localStorage.getItem(id);
      });
    };

    function saveKeys() {
      ['keyDeepseek', 'keyQwen', 'keyGemini'].forEach(id => {
        localStorage.setItem(id, document.getElementById(id).value.trim());
      });
      alert("✅ Ключи сохранены");
    }

    // Обращение к нашему серверу GAS за субтитрами
    async function fetchSubtitles(url) {
      if (GAS_WEB_APP_URL.includes("ВАШ_URL")) {
        throw new Error("Вставьте ссылку на Google Apps Script в код страницы!");
      }

      // Используем GET запрос, чтобы обойти CORS
      const requestUrl = `${GAS_WEB_APP_URL}?url=${encodeURIComponent(url)}`;
      const res = await fetch(requestUrl);
      const data = await res.json();

      if (!data.success) {
        throw new Error(data.error);
      }
      return data.transcript;
    }

    async function generateScript() {
      const url = document.getElementById('videoUrl').value.trim();
      const provider = document.getElementById('aiProvider').value;
      const loader = document.getElementById('loader');
      const loaderText = document.getElementById('loaderText');
      const resultContainer = document.getElementById('resultContainer');
      const btn = document.getElementById('submitBtn');

      const keys = {
        deepseek: document.getElementById('keyDeepseek').value.trim(),
        qwen: document.getElementById('keyQwen').value.trim(),
        gemini: document.getElementById('keyGemini').value.trim()
      };

      if (!keys[provider]) return alert(`❌ Укажите ключ для ${provider.toUpperCase()}`);
      if (!url) return alert("❌ Вставьте ссылку на видео");

      btn.disabled = true;
      btn.classList.add('opacity-50');
      resultContainer.classList.add('hidden');
      loader.classList.remove('hidden');

      try {
        loaderText.innerText = "1/2: Тянем текст из видео через наш бэкенд...";
        const transcript = await fetchSubtitles(url);

        loaderText.innerText = `2/2: Переписываем сценарий через ${provider.toUpperCase()}...`;
        const aiData = await callAI(provider, keys[provider], transcript);

        document.getElementById('resTitle').innerText = Array.isArray(aiData.title) ? aiData.title.join(' | ') : aiData.title;
        document.getElementById('resHook').innerText = aiData.hook;
        document.getElementById('resScript').innerText = aiData.script;
        document.getElementById('resSEO').innerText = aiData.seo_description;
        document.getElementById('resTags').innerText = aiData.hashtags;
        document.getElementById('resVisuals').innerText = aiData.visuals;
        
        resultContainer.classList.remove('hidden');

      } catch (err) {
        alert("⚠️ Ошибка: " + err.message);
      } finally {
        loader.classList.add('hidden');
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      }
    }

    async function callAI(provider, key, text) {
      const prompt = `Ты профи по контенту на YouTube. Перепиши этот сценарий своими словами, сохранив быструю динамику для удержания.
Формат ответа СТРОГО в JSON (без лишнего текста и маркдауна):
{
  "title": "3 варианта заголовка",
  "hook": "Мощный хук для первых 3 секунд",
  "script": "Полный текст нового сценария (короткие абзацы)",
  "visuals": "Идеи для B-roll кадров",
  "seo_description": "SEO описание",
  "hashtags": "#тег1 #тег2"
}`;

      let endpoint, headers, body;

      if (provider === 'gemini') {
        endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
        headers = { "Content-Type": "application/json" };
        body = {
          contents: [{ role: "user", parts: [{ text: prompt + "\n\nИсходник:\n" + text }] }],
          generationConfig: { responseMimeType: "application/json" }
        };
      } else {
        endpoint = provider === 'qwen' 
          ? "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions" 
          : "https://api.deepseek.com/chat/completions";
        
        headers = { "Content-Type": "application/json", "Authorization": `Bearer ${key}` };
        body = {
          model: provider === 'qwen' ? "qwen-plus" : "deepseek-chat",
          messages: [
            { role: "system", content: prompt },
            { role: "user", content: "Исходник:\n" + text }
          ],
          response_format: { type: "json_object" }
        };
      }

      const res = await fetch(endpoint, { method: "POST", headers, body: JSON.stringify(body) });
      const rawData = await res.json();

      if (!res.ok) throw new Error(rawData.error?.message || "Ошибка API");

      let contentStr = provider === 'gemini' 
        ? rawData.candidates[0].content.parts[0].text 
        : rawData.choices[0].message.content;

      contentStr = contentStr.replace(/```json/gi, '').replace(/```/gi, '').trim();
      return JSON.parse(contentStr);
    }
  </script>
</body>
</html>
